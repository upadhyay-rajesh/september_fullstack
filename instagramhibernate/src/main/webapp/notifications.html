<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Notifications</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top"><div class="container">
<a class="navbar-brand" href="home.html">Instagram Clone</a>
<div><a class="btn btn-sm btn-outline-primary me-2" href="profile.html">Profile</a><button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button></div>
</div></nav>

<div class="container py-5"><h2>Notifications</h2><div id="notifications"></div></div>
<script>
async function load(){let x=await api('api/notifications');document.getElementById('notifications').innerHTML=x.map(n=>`<div class="alert alert-light border">@${esc(n.actor.username)} ${esc(n.message)} <button class="btn btn-sm btn-link" onclick="read(${n.id})">mark read</button></div>`).join('');}
async function read(id){await api('api/notifications',{method:'POST',body:enc({id})});load();}
document.addEventListener('DOMContentLoaded',load);
</script>

<script src="js/app.js"></script></body></html>
