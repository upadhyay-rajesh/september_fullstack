<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Search</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top"><div class="container">
<a class="navbar-brand" href="home.html">Instagram Clone</a>
<div><a class="btn btn-sm btn-outline-primary me-2" href="profile.html">Profile</a><button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button></div>
</div></nav>

<div class="container py-5"><h2>Search Users / Posts</h2>
<div class="input-group mb-4"><input id="q" class="form-control" placeholder="Search"><button class="btn btn-primary" onclick="search()">Search</button></div>
<div id="results"></div></div>
<script>
async function search(){let q=document.getElementById('q').value;let x=await api('api/users?q='+encodeURIComponent(q));document.getElementById('results').innerHTML=x.map(u=>`<div class="card mb-2"><div class="card-body"><a href="profile.html?id=${u.id}">@${esc(u.username)}</a> - ${esc(u.fullName)}</div></div>`).join('');}
</script>

<script src="js/app.js"></script></body></html>
