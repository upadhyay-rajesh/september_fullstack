<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Stories</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top"><div class="container">
<a class="navbar-brand" href="home.html">Instagram Clone</a>
<div><a class="btn btn-sm btn-outline-primary me-2" href="profile.html">Profile</a><button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button></div>
</div></nav>

<div class="container py-5"><h2>Stories</h2><div id="stories"></div>
<form class="mt-4" onsubmit="event.preventDefault();createStory()"><input id="mediaUrl" class="form-control mb-2" placeholder="Image/video URL"><button class="btn btn-primary">Add Story</button></form></div>
<script>
async function load(){let x=await api('api/stories');document.getElementById('stories').innerHTML=x.map(s=>`<div class="card mb-2"><div class="card-body"><b>@${esc(s.user.username)}</b><br><a href="${esc(s.mediaUrl)}" target="_blank">View story</a></div></div>`).join('');}
async function createStory(){await api('api/stories',{method:'POST',body:enc({mediaUrl:document.getElementById('mediaUrl').value})});load();}
document.addEventListener('DOMContentLoaded',load);
</script>

<script src="js/app.js"></script></body></html>
