<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Saved Posts</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css"></head><body>
<nav class="navbar navbar-expand-lg bg-white border-bottom sticky-top"><div class="container">
<a class="navbar-brand" href="home.html">Instagram Clone</a>
<div><a class="btn btn-sm btn-outline-primary me-2" href="profile.html">Profile</a><button class="btn btn-sm btn-outline-danger" onclick="logout()">Logout</button></div>
</div></nav>

<div class="container py-5"><h2>Saved Posts</h2><div id="saved"></div></div>
<script>
async function load(){let x=await api('api/saved');document.getElementById('saved').innerHTML=x.map(p=>`<div class="card mb-3">${p.imageUrl?`<img class="post-img" src="${esc(p.imageUrl)}">`:''}<div class="card-body"><b>@${esc(p.user.username)}</b><p>${esc(p.caption)}</p></div></div>`).join('');}
document.addEventListener('DOMContentLoaded',load);
</script>

<script src="js/app.js"></script></body></html>
