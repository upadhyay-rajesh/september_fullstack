<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FashionHub | Product</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body><div id="navbar"></div>
<section class="py-5"><div class="container"><div id="productDetails"></div></div></section>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script><script src="js/common.js"></script>
<script>
document.addEventListener("DOMContentLoaded",()=>{
 renderNavbar(); renderFooter();
 const id=Number(new URLSearchParams(location.search).get("id"));
 const p=products.find(x=>x.id===id);
 const el=document.getElementById("productDetails");
 if(!p){el.innerHTML='<div class="text-center"><h2>Product not found</h2><a href="shop.html" class="btn btn-fashion">Back to Shop</a></div>';return;}
 el.innerHTML=`
 <div class="row g-5 align-items-center">
 <div class="col-md-6"><img class="img-fluid rounded product-detail-img" src="${p.image}" alt="${p.name}"></div>
 <div class="col-md-6"><span class="badge text-bg-dark mb-2">${p.category.toUpperCase()}</span>
 <h1>${p.name}</h1><div class="rating mb-3">★★★★★</div>
 <h2>₹${p.price.toLocaleString("en-IN")} ${p.oldPrice?`<del class="old-price">₹${p.oldPrice.toLocaleString("en-IN")}</del>`:""}</h2>
 <p class="text-secondary mt-3">${p.description}</p>
 <label class="fw-bold">Size</label><select id="size" class="form-select w-50 mt-2 mb-3"><option>S</option><option>M</option><option>L</option><option>XL</option></select>
 <div class="d-flex gap-2"><button class="btn btn-fashion btn-lg" onclick="addToCart(${p.id})">Add To Cart</button><button class="btn btn-outline-dark btn-lg" onclick="toggleWishlist(${p.id})"><i class="bi bi-heart"></i></button></div>
 </div></div>`;
});
</script></body></html>
