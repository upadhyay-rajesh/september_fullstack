<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FashionHub | Register</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="navbar"></div><section class="auth-section"><div class="auth-card"><h2>Create Account</h2><p class="text-secondary">Join FashionHub today</p>
<form id="registerForm"><input id="regName" class="form-control mb-3" placeholder="Full Name" required><input id="regEmail" type="email" class="form-control mb-3" placeholder="Email Address" required><input id="regPassword" type="password" class="form-control mb-3" placeholder="Password" minlength="6" required><input id="regConfirm" type="password" class="form-control mb-3" placeholder="Confirm Password" required><button class="btn btn-fashion w-100">CREATE ACCOUNT</button></form><p class="mt-4 text-center">Already registered? <a href="login.html">Login</a></p></div></section><div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/common.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{renderNavbar();renderFooter();document.getElementById("registerForm").addEventListener("submit",e=>{e.preventDefault();if(regPassword.value!==regConfirm.value){alert("Passwords do not match.");return;}localStorage.setItem("fashionUser",regEmail.value);showToast("Account created successfully!");setTimeout(()=>location.href="index.html",700);});});</script></body></html>
