<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FashionHub | Shop</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<div id="navbar"></div>
<div class="page-header"><div class="container"><h1>Shop</h1><p>Discover your next favorite look</p></div></div>
<section class="py-5"><div class="container">
<div class="row mb-4">
  <div class="col-md-4"><select id="categoryFilter" class="form-select"><option value="all">All Categories</option><option value="women">Women</option><option value="men">Men</option><option value="kids">Kids</option><option value="shoes">Shoes</option><option value="sale">Sale</option></select></div>
  <div class="col-md-4 mt-2 mt-md-0"><select id="sortFilter" class="form-select"><option value="default">Sort By</option><option value="low">Price: Low to High</option><option value="high">Price: High to Low</option><option value="name">Name</option></select></div>
  <div class="col-md-4 mt-2 mt-md-0"><input id="shopSearch" class="form-control" placeholder="Search products..."></div>
</div>
<div id="shopProducts" class="row g-4"></div>
</div></section>
<div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="js/products.js"></script><script src="js/common.js"></script>
<script>
document.addEventListener("DOMContentLoaded", () => {
 renderNavbar("shop"); renderFooter();
 const params=new URLSearchParams(location.search);
 const initial=params.get("category")||"all";
 document.getElementById("categoryFilter").value=initial;
 function refresh(){
   let list=[...products], cat=document.getElementById("categoryFilter").value, q=document.getElementById("shopSearch").value.toLowerCase();
   if(cat!=="all") list=list.filter(p=>p.category===cat || (cat==="sale" && p.sale));
   if(q) list=list.filter(p=>p.name.toLowerCase().includes(q));
   const sort=document.getElementById("sortFilter").value;
   if(sort==="low") list.sort((a,b)=>a.price-b.price);
   if(sort==="high") list.sort((a,b)=>b.price-a.price);
   if(sort==="name") list.sort((a,b)=>a.name.localeCompare(b.name));
   renderProducts("shopProducts",list);
 }
 ["categoryFilter","sortFilter","shopSearch"].forEach(id=>document.getElementById(id).addEventListener("input",refresh));
 refresh();
});
</script>
</body></html>
