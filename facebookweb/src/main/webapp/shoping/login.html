<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FashionHub | Login</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="navbar"></div>
<section class="auth-section"><div class="auth-card"><h2>Welcome Back</h2><p class="text-secondary">Login to your FashionHub account</p>
<form id="loginForm"><input id="loginEmail" type="email" class="form-control mb-3" placeholder="Email Address" required><input id="loginPassword" type="password" class="form-control mb-3" placeholder="Password" required><div class="d-flex justify-content-between mb-3"><label><input type="checkbox"> Remember me</label><a href="#" onclick="forgotPassword(event)">Forgot Password?</a></div><button class="btn btn-fashion w-100">LOGIN</button></form><p class="mt-4 text-center">Don't have an account? <a href="register.html">Create Account</a></p></div></section>
<div id="footer"></div><script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/common.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{renderNavbar();renderFooter();document.getElementById("loginForm").addEventListener("submit",e=>{e.preventDefault();localStorage.setItem("fashionUser",document.getElementById("loginEmail").value);showToast("Login successful!");setTimeout(()=>location.href="index.html",700);});});function forgotPassword(e){e.preventDefault();alert("Password reset link would be sent to your email.");}</script></body></html>
