<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1.0"><title>FashionHub | Contact</title><link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"><link rel="stylesheet" href="css/style.css"></head>
<body><div id="navbar"></div><div class="page-header"><div class="container"><h1>Contact Us</h1><p>We would love to hear from you</p></div></div>
<section class="py-5"><div class="container"><div class="row g-5"><div class="col-md-5"><h3>Get In Touch</h3><p><b>Address:</b> Bengaluru, India</p><p><b>Phone:</b> +91 98765 43210</p><p><b>Email:</b> support@fashionhub.com</p><p>Our customer support team is available 24/7.</p></div><div class="col-md-7"><form id="contactForm"><input class="form-control mb-3" placeholder="Your Name" required><input type="email" class="form-control mb-3" placeholder="Your Email" required><input class="form-control mb-3" placeholder="Subject" required><textarea class="form-control mb-3" rows="5" placeholder="Your Message" required></textarea><button class="btn btn-fashion">SEND MESSAGE</button></form></div></div></div></section><div id="footer"></div>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script><script src="js/common.js"></script><script>document.addEventListener("DOMContentLoaded",()=>{renderNavbar();renderFooter();contactForm.addEventListener("submit",e=>{e.preventDefault();showToast("Message sent successfully!");e.target.reset();});});</script></body></html>
