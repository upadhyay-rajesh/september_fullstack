spring.application.name=order-management
server.port=8081

# Use the SAME database as Product Management so order_items can reference products.id
spring.datasource.url=jdbc:mysql://localhost:3306/product_management
spring.datasource.username=root
spring.datasource.password=rajesh
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Creates customer_orders and order_items. Existing products table is mapped but not created by this app.
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/v3/api-docs
